<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Swiss Reglette encoder by Wyatt Richard">
        <meta name="keywords" content="Wyatt Richard, Projects, Swiss Reglette">
        <meta name="author" content="Wyatt Richard">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Swiss Reglette</title>

        <link rel="icon" href="../../assets/images/icon.png">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- CSS -->
        <link href="../../assets/css/style.css" rel="stylesheet">

    </head>
    <body class="bg-primary d-flex flex-column min-vh-100">
        <!-- Navbar -->
        <div id="navbar-placeholder" data-root="../../"></div>
        
        <div class = "container mt-5 pt-5">
            <div class="row">
                <h1>Swiss Reglette</h1>
                https://www.cryptomuseum.com/crypto/swiss/reglette/
                https://www.youtube.com/watch?v=jvrUCylwGaU
            </div>

        </div>

        <div class="container mt-5 pt-5">
            <fieldset>
                <label for="keyword">Key Word:</label><br>
                <input type="text" id="keyword" name="keyword"><br>
                <p id="keyWordErrorMsg" class="error_message"></p>

                <label for="keynumber">Key Number:</label><br>
                <input type="number" id="keynumber" name="keynumber"><br>
                <p id="keyNumberErrorMsg" class="error_message"></p>

                <label for="message">Message:</label><br>
                <textarea id="message"></textarea><br>
                <p id="messageErrorMsg" class="error_message"></p>

                <input type="button" onclick="decrypt()" value="Decrypt">
                <input type="button" onclick="encrypt()" value="Encrypt">
                <!-- <p> use the # character as a swap character</p> !-->
                <p id="output"></p>
            </fieldset>
        </div>
        <footer class="py-3 mt-auto">
            <div class="text-center border-top pt-3">
                <p>© Copyright 2023 Wyatt Richard.</p>
            </div>
        </footer>
        
        <!-- JS -->
        <script src="../../common/navbar.js"></script>
        <script src="./js/swiss-reglette.js"></script>
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
